
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OrangeHRM Automation Dashboard</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<div class="container-fluid dashboard-container py-4 px-4 px-lg-5">

    <!-- Header -->
    <header class="text-center mb-5">


        <h1 class="fw-bold">OrangeHRM Automation</h1>

        <p class="text-secondary">
            Dashboard-driven Employee Management System
        </p>


    </header>

    <div class="row justify-content-center">

        <div class="col-12 col-xl-10 col-xxl-9">

            <!-- Main Card -->
            <div class="card border-0 shadow-lg rounded-4">

                <div class="card-body p-4 p-md-5">

                    <!-- Card Heading -->
                    <div class="d-flex align-items-center gap-3 mb-4">

                        <div class="icon-box">
                            <i class="bi bi-person-plus-fill"></i>
                        </div>

                        <div>
                            <h2 class="h4 fw-bold mb-1">
                                Employee Registration
                            </h2>

                        </div>

                    </div>

                    <form id="employeeForm">

                        <!-- Login Section -->
                        <div class="section-heading mb-3">
                            <i class="bi bi-shield-lock me-2"></i>
                            OrangeHRM Login Credentials
                        </div>

                        <div class="mb-3">

                            <label for="username" class="form-label fw-semibold">
                                Username
                            </label>

                            <input
                                type="text"
                                id="username"
                                class="form-control form-control-lg"
                                placeholder="Enter OrangeHRM username"
                                value="Admin"
                                required
                            >

                        </div>

                        <div class="mb-4">

                            <label for="password" class="form-label fw-semibold">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                class="form-control form-control-lg"
                                placeholder="Enter OrangeHRM password"
                                required
                            >

                        </div>

                        <hr class="my-4">

                        <!-- Employee Section -->
                        <div class="section-heading mb-3">
                            <i class="bi bi-person-vcard me-2"></i>
                            Employee Information
                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label for="first_name" class="form-label fw-semibold">
                                    First Name
                                </label>

                                <input
                                    type="text"
                                    id="first_name"
                                    class="form-control form-control-lg"
                                    placeholder="Enter first name"
                                    required
                                >

                            </div>

                            <div class="col-md-6 mb-3">

                                <label for="last_name" class="form-label fw-semibold">
                                    Last Name
                                </label>

                                <input
                                    type="text"
                                    id="last_name"
                                    class="form-control form-control-lg"
                                    placeholder="Enter last name"
                                    required
                                >

                            </div>

                        </div>

                        <div class="mb-4">

                            <label for="employee_id" class="form-label fw-semibold">
                                Employee ID
                            </label>

                            <input
                                type="text"
                                id="employee_id"
                                class="form-control form-control-lg"
                                placeholder="Enter employee ID"
                                required
                            >

                            <div class="form-text">
                                Enter a unique Employee ID.
                            </div>

                        </div>

                        <!-- Submit Button -->
                        <button
                            type="submit"
                            id="submitBtn"
                            class="btn btn-primary btn-lg w-100"
                        >
                            <i class="bi bi-play-circle-fill me-2"></i>
                            Start Automation
                        </button>

                    </form>

                    <!-- Automation Result -->
                    <div id="result" class="mt-4"></div>

                </div>

            </div>

            <!-- Information -->
            <div class="text-center mt-4">

                <small class="text-secondary">
                    <i class="bi bi-info-circle me-1"></i>
                    Powered by Python, FastAPI and Selenium
                </small>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JavaScript -->
<script src="/static/js/script.js"></script>

</body>
</html>
